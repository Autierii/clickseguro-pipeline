name: Security Scan with OWASP ZAP

on: [push]

jobs:
  zap-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Start application
        run: npm start &  # Inicia em background
        timeout-minutes: 1  # Dá tempo para iniciar

      - name: Wait for app to be ready
        run: sleep 10  # Espera 10s para o app subir

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-f html -o report.html'
          fail_action: true  # Ativa falha no pipeline
          rules_file_name: '.zap/rules.tsv'  # Arquivo para ignorar falsos positivos (opcional)
          issue_title: 'Vulnerabilidades Detectadas'  # Cria issue no GitHub se falhar

      - name: Upload report (temporário, aprimoraremos depois)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report.html